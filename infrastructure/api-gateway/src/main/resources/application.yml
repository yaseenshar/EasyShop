server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global CORS config — applies to all routes
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"   # Angular dev server
              - "https://easyshop.com"    # Production
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to every route
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: RequestRateLimiter
          args:
            # Redis-backed token bucket algorithm
            redis-rate-limiter.replenishRate: 10   # tokens added per second
            redis-rate-limiter.burstCapacity: 20   # max burst
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"    # Rate limit per user (from JWT claim)

      routes:
        # Each route: id, uri (lb:// = Eureka load-balanced), predicates, filters
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2   # removes /api/v1 before forwarding

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - StripPrefix=2

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter   # Only authenticated users can create orders

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - StripPrefix=2

        - id: payment-service
          # NEVER expose payment endpoints publicly — internal only
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

  # Redis config for rate limiting
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true   # Critical in Docker/K8s — use IP, not hostname
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30