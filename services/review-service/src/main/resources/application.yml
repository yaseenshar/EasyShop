server:
  port: 8087

spring:
  application:
    name: review-service

  datasource:
    # Per-service isolated database - review gets its own MySQL database.
    url: jdbc:mysql://localhost:3306/easyshop_review?useSSL=false&serverTimezone=UTC
    username: easyshop
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_review

  # HTTP service group config for the OrderPurchaseClient (verified-current
  # Boot 4 pattern: per-group properties under spring.http.client.service).
  http:
    client:
      service:
        group:
          order-service:
            # lb:// relies on Spring Cloud 2025.1's confirmed load-balancing
            # support for HTTP service groups resolving through Eureka.
            # FLAGGED: capability confirmed via spring.io blog, exact
            # property syntax unverified - if lb:// isn't honored here,
            # fall back to the direct form below and check the Spring
            # Cloud 2025.1 docs for the load-balanced variant.
            # base-url: http://localhost:8082
            base-url: lb://order-service
            read-timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/easyshop

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0