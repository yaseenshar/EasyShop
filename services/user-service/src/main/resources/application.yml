server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/easyshop
    username: easyshop
    password: ${POSTGRES_PASSWORD}
    hikari:
      # HikariCP is Spring Boot's default connection pool (still true in Boot 4).
      # Sizing rationale: pool size should be roughly
      # ((core_count * 2) + effective_spindle_count) per the standard HikariCP
      # sizing formula - a known interview talking point.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    # NEVER use 'update' or 'create' here - see Step 2.5 rationale.
    # Flyway owns schema; Hibernate only maps to what Flyway created.
    hibernate:
      ddl-auto: validate
    open-in-view: false   # avoid the N+1-masking anti-pattern; explicit fetching only
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_user

  # ═══ OAuth2 Resource Server — verified syntax from Spring Security 7.0.4 docs ═══
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring Boot auto-discovers the JWKS endpoint from this issuer's
          # /.well-known/openid-configuration - no manual key management needed.
          issuer-uri: http://localhost:8090/realms/easyshop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0   # 100% sampling for dev; lower in production (e.g. 0.1)