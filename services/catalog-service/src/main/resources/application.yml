server:
  port: 8085

spring:
  application:
    name: catalog-service

  datasource:
    # Per-service isolated database - the hard project rule. Catalog gets
    # its own MySQL database, separate from easyshop_inventory.
    url: jdbc:mysql://localhost:3306/easyshop_catalog?useSSL=false&serverTimezone=UTC
    username: easyshop
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_catalog

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  cache:
    type: redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,caches
  tracing:
    sampling:
      probability: 1.0