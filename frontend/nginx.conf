# Mirrors proxy.conf.json's routing (used by `ng serve` for local dev) so
# the same four path prefixes reach api-gateway in the dockerized build.
# proxy_pass with no path component after the host preserves the original
# request URI unchanged - e.g. /api/v1/orders -> http://api-gateway:8080/api/v1/orders -
# matching proxy.conf.json's behavior (no pathRewrite there either).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded DNS server on the compose network.
    # A bare `proxy_pass http://api-gateway:8080;` resolves the hostname
    # ONCE at config load - if api-gateway isn't DNS-resolvable yet (this
    # container started first, or api-gateway restarted), nginx refuses to
    # even start ("host not found in upstream"), crash-looping instead of
    # serving the SPA. Routing through a variable defers resolution to
    # REQUEST time via this resolver: a slow/late api-gateway becomes a
    # per-request 502 instead of nginx never starting - the same
    # client-retries-instead-of-container-choreography spirit as this
    # compose file's other app-to-app dependencies.
    resolver 127.0.0.11 valid=10s;
    set $api_gateway api-gateway:8080;

    # $host strips the port (nginx docs: $host never includes it, unlike
    # $http_host) - api-gateway's OAuth2 redirect-uri is templated as
    # "{baseUrl}/login/oauth2/code/{registrationId}" and baseUrl is derived
    # from the Host header it receives. With $host, the gateway saw
    # "Host: localhost" and built redirect_uri=http://localhost/login/...
    # (no :4200), which matches neither of the two URIs Keycloak has
    # registered for this client (:8080 direct, :4200 dev-proxy) - Keycloak
    # then 400s the whole login with "Invalid parameter: redirect_uri".
    # $http_host preserves the port exactly as the browser sent it.

    location /api/ {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://$api_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed filenames (main-<hash>.js, chunk-<hash>.js,
    # styles-<hash>.css) are immutable by construction - a code change
    # always produces a new filename, so these can be cached indefinitely.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is the one file whose content changes without its own
    # filename changing (it's what points browsers at the current hashed
    # bundle). No Cache-Control at all here previously let browsers apply
    # heuristic caching and keep serving an old index.html - which meant
    # old chunk references - after a redeploy, with no way to tell short of
    # a hard refresh. no-cache forces revalidation (via ETag) on every load
    # without disabling the fast 304 path.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a raw nginx 404, so deep links (e.g. /shop/some-product)
    # work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
