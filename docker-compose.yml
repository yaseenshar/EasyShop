networks:
  easyshop-network:
    driver: bridge

services:

  # ── Service Discovery ──────────────────────────────────────────────────
  service-discovery:
    build:
      context: .
      dockerfile: infrastructure/service-discovery/Dockerfile
    ports:
      - "8761:8761"
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── API Gateway ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    networks: [easyshop-network]
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .                                    # build context = repo root
      dockerfile: services/user-service/Dockerfile   # so it can COPY parent pom.xml + common-lib
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easyshop_user
      - SPRING_DATASOURCE_USERNAME=easyshop
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/easyshop
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks: [ easyshop-network ]
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # JVM + Flyway migration needs warm-up time before passing

  order-service:
    build:
      context: .                                    # build context = repo root
      dockerfile: services/order-service/Dockerfile   # so it can COPY parent pom.xml + common-lib
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easyshop_order
      - SPRING_DATASOURCE_USERNAME=easyshop
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/easyshop
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks: [ easyshop-network ]
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # JVM + Flyway migration needs warm-up time before passing


  inventory-service:
    build:
      context: .                                    # build context = repo root
      dockerfile: services/inventory-service/Dockerfile   # so it can COPY parent pom.xml + common-lib
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/easyshop_inventory
      - SPRING_DATASOURCE_USERNAME=easyshop
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/easyshop
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks: [ easyshop-network ]
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # JVM + Flyway migration needs warm-up time before passing

  payment-service:
    build:
      context: .                                    # build context = repo root
      dockerfile: services/payment-service/Dockerfile   # so it can COPY parent pom.xml + common-lib
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easyshop_payment
      - SPRING_DATASOURCE_USERNAME=easyshop
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/easyshop
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks: [ easyshop-network ]
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # JVM + Flyway migration needs warm-up time before passing

  catalog-service:
    build:
      context: .                                    # build context = repo root
      dockerfile: services/catalog-service/Dockerfile   # so it can COPY parent pom.xml + common-lib
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/easyshop_catalog
      - SPRING_DATASOURCE_USERNAME=easyshop
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/easyshop
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks: [ easyshop-network ]
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # JVM + Flyway migration needs warm-up time before passing

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine    # Alpine = minimal image, ~80MB vs ~400MB full
    environment:
      POSTGRES_USER: easyshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: easyshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d  # init scripts per service DB
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: easyshop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: easyshop
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cluster mode for production-like config) ───────────────────
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka + Zookeeper ─────────────────────────────────────────────────
  # Design note: In production, Kafka uses KRaft mode (no Zookeeper).
  # We use Zookeeper here because most tutorials use it and it's stable.
  # You should learn KRaft for interview knowledge.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [easyshop-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for internal Docker network, one for host machine
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1    # 1 for dev; 3 in production
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'      # Explicit topic creation only
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kafka UI (extremely useful during development) ────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [easyshop-network]

  # ── Keycloak (OAuth2 + OIDC auth server) ──────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm   # dev mode; production uses start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: easyshop
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [easyshop-network]

  # ── Observability Stack ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks: [easyshop-network]

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks: [easyshop-network]

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  grafana-data: