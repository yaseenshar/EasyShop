# Build, test and static analysis for EasyShop.
#
# Runs on GitHub-hosted ubuntu runners, which ship a working Docker daemon -
# that is not incidental. A large share of this repo's tests are Testcontainers
# integration tests against real Redis, Postgres, MySQL and Kafka, and they are
# the tests that carry the weight: the caching, tracing and session work was
# repeatedly proved wrong by behaviour no mock reproduces. A runner without
# Docker would still go green while skipping everything that matters.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Lets a run be triggered by hand, which is how you verify a fix to the
  # pipeline itself without pushing an empty commit.
  workflow_dispatch:

# A second push to the same branch cancels the first. Without this, a busy
# branch queues runs that are already answering an out-of-date question, and on
# a suite this long the queue is what makes CI feel slow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Nothing here writes to the repository; a job that
# later needs to (publishing an image, commenting on a PR) should widen this at
# the job level rather than here.
permissions:
  contents: read

jobs:
  backend:
    name: Backend build, test & analysis
    runs-on: ubuntu-latest
    # The full suite spins up a dozen containers across modules. 45 minutes is
    # generous against the ~10 minutes it takes locally, because a cold runner
    # also pulls every image; the point of the limit is to kill a hung job, not
    # to police the runtime.
    timeout-minutes: 45

    env:
      # Read once into the environment so the conditional below can see them.
      # Secrets are NOT directly readable in a step-level `if:` expression, and
      # a condition written against secrets.* silently evaluates to empty -
      # which would skip Sonar forever without ever saying so.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Sonar attributes issues to authors and distinguishes new code from
          # old using git history; a shallow clone leaves it unable to do either
          # and it warns rather than fails, so the analysis quietly degrades.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on the pom files. The first run is slow; every
          # run after that skips re-downloading the Spring Boot dependency tree,
          # which is the single largest fixed cost in this build.
          cache: maven

      - name: Validate the Maven reactor
        working-directory: backend
        # Fails in seconds if the module list is broken - notably if
        # infrastructure/config-server is ever uncommented in backend/pom.xml,
        # since that directory is untracked and does not exist in a clean
        # checkout. Without this the same failure surfaces 20 minutes later,
        # after the test suite has burned a runner.
        run: mvn -B -ntp validate

      - name: Compile
        working-directory: backend
        # Compiling before testing splits "the code does not build" from "the
        # code builds but misbehaves". They have different owners and different
        # fixes, and a single combined step reports both as one red X.
        run: mvn -B -ntp -DskipTests package

      - name: Test with coverage
        working-directory: backend
        # verify, not test: JaCoCo's report is bound to the verify phase, and
        # Sonar reads that XML. Running only `test` produces green tests and an
        # analysis claiming zero coverage.
        run: mvn -B -ntp verify

      - name: Upload test reports
        # always(): the reports are most wanted when the step before failed.
        # A conditionless upload step is skipped on failure, which is precisely
        # backwards.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: warn

      - name: SonarQube analysis
        # Skipped cleanly when no token is configured, so the pipeline is green
        # and useful from the first push and Sonar switches itself on the moment
        # the secret exists. The alternative - a hard-coded project key - fails
        # confusingly for whoever runs it first.
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            ${SONAR_HOST_URL:+-Dsonar.host.url="$SONAR_HOST_URL"} \
            ${SONAR_PROJECT_KEY:+-Dsonar.projectKey="$SONAR_PROJECT_KEY"} \
            ${SONAR_ORGANIZATION:+-Dsonar.organization="$SONAR_ORGANIZATION"}

      - name: Note when analysis was skipped
        # Silence is the enemy here: a skipped step looks identical to a step
        # that ran and found nothing. This says which it was, in the log.
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice title=SonarQube skipped::SONAR_TOKEN is not set." \
            "Add it under Settings > Secrets and variables > Actions, plus the" \
            "SONAR_HOST_URL / SONAR_PROJECT_KEY (and SONAR_ORGANIZATION for" \
            "SonarCloud) variables, and this step activates automatically."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Angular 22's CLI refuses to run below v22.22.3 (or 24.15.0 / 26.0.0)
          # and exits 3 with that message. '22' resolves to the latest 22.x,
          # which clears that floor, and matches the Angular major in
          # package.json.
          #
          # This was originally pinned to 20 and failed on the first CI run: the
          # local rehearsal happened to use Node 26, so it proved the build works
          # on the developer's machine and nothing about the runner. Pinning a
          # toolchain version means the rehearsal has to pin the same one.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `npm ci`, never `npm install`: ci installs exactly the lockfile and
        # fails if package.json and the lock disagree. install would quietly
        # resolve newer versions, so CI would be testing a dependency set that
        # exists nowhere else.
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Angular unit tests are deliberately NOT run yet. `ng test` defaults to
      # watch mode with a real Chrome, and this project has no ChromeHeadless
      # launcher or CI configuration - wiring that is its own piece of work, and
      # a test step that hangs a runner for 15 minutes teaches people to ignore
      # CI. Building at least catches a frontend that no longer compiles.

  publish-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only after both build jobs are green. Publishing an image whose tests
    # failed puts a known-bad artifact in a registry where something else may
    # pull it, and the tag says nothing about that.
    needs: [backend, frontend]
    # Default branch pushes only. Pull requests are excluded on purpose: a PR
    # from a fork cannot read secrets (so the job could only fail), and images
    # built from unreviewed branches do not belong in a shared namespace.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Namespace defaults to the account name, which is how Docker Hub works
      # for a personal account; set the variable to publish under an org.
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Note when publishing was skipped
        if: env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::notice title=Image publish skipped::DOCKERHUB_TOKEN is not set." \
            "Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings > Secrets" \
            "and variables > Actions (a Docker Hub access token, not your" \
            "password), and this job publishes automatically."

      - name: Set up JDK 21
        if: env.DOCKERHUB_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build modules
        if: env.DOCKERHUB_TOKEN != ''
        working-directory: backend
        # install, not package: the next step excludes common-lib from the
        # reactor, so the services resolve it from the local repository. With
        # only `package` it would not be there and every service would fail to
        # resolve com.easyshop:common-lib.
        run: mvn -B -ntp -DskipTests install

      - name: Build & push service images (Jib)
        if: env.DOCKERHUB_TOKEN != ''
        working-directory: backend
        # Jib builds straight from the compiled classes - no Docker daemon, no
        # second Maven build inside a Dockerfile. That is the whole reason this
        # job takes minutes instead of the ~40+ that ten Dockerfile builds
        # would, since each of those re-runs the reactor internally.
        #
        # -pl '!common/common-lib' selects exactly the right set without naming
        # ten modules: the aggregator pom skips itself ("Skipping
        # containerization because packaging is 'pom'"), common-lib is excluded
        # because it is a library with no main class and Jib errors on it, and
        # a service added later is picked up with no edit here.
        #
        # Tags: the pom supplies :${project.version}; the SHA tag is the
        # immutable one worth deploying, and :latest is the convenience alias.
        # A version tag alone would be mutable and untraceable back to a commit.
        run: |
          mvn -B -ntp com.google.cloud.tools:jib-maven-plugin:build \
            -pl '!common/common-lib' \
            -Djib.registry=docker.io \
            -Djib.namespace="$DOCKERHUB_NAMESPACE" \
            -Djib.to.tags=latest,${{ github.sha }}

      - name: Set up Buildx
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        if: env.DOCKERHUB_TOKEN != ''
        # The frontend is nginx serving static files, so Jib does not apply -
        # it containerises JVM applications. This one keeps its Dockerfile,
        # with buildx layer caching so an unchanged frontend is close to free.
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/easyshop-frontend:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/easyshop-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise published images
        if: env.DOCKERHUB_TOKEN != ''
        # Puts the exact pullable references in the run summary, so nobody has
        # to reconstruct the tag from the commit to find what was published.
        run: |
          {
            echo "### Published images"
            echo ""
            echo "Namespace: \`$DOCKERHUB_NAMESPACE\` · immutable tag: \`${{ github.sha }}\`"
            echo ""
            echo '```'
            echo "docker pull $DOCKERHUB_NAMESPACE/easyshop-cart-service:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
