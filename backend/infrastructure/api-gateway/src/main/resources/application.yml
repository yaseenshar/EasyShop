server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Spring Cloud Gateway 5.x (spring-cloud-starter-gateway-server-webflux)
      # moved route/CORS/filter config under spring.cloud.gateway.server.webflux.*
      # The classic spring.cloud.gateway.* prefix is SILENTLY IGNORED -
      # zero routes registered, every request 404s, no error logged.
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "https://easyshop.com"
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: true
                maxAge: 3600

          default-filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            # NO TokenRelay: that filter relays an OAuth2AuthorizedClient and
            # requires the gateway to be an OAuth2 CLIENT (login flow). This
            # gateway is a RESOURCE SERVER - the SPA holds the token and sends
            # it as a Bearer header, which Gateway forwards downstream
            # unchanged by default. TokenRelay here would be a no-op or error.

          routes:
            # AUTHENTICATION IS NO LONGER A PER-ROUTE FILTER.
            # The deleted AuthenticationFilter verified with HMAC
            # (Keys.hmacShaKeyFor) while Keycloak signs RS256 - it rejected
            # every real token. Authentication now happens once, centrally,
            # in GatewaySecurityConfig's SecurityWebFilterChain (public paths
            # permitted there, everything else authenticated). Routes here do
            # routing only - one concern per layer.

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userCb
                    fallbackUri: forward:/fallback/user

            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCb
                    fallbackUri: forward:/fallback/catalog

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCb
                    fallbackUri: forward:/fallback/order

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cartCb
                    fallbackUri: forward:/fallback/cart

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/v1/reviews/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reviewCb
                    fallbackUri: forward:/fallback/review

            # Still deliberately UNROUTED: payment-service and
            # inventory-service (Kafka-driven only), notification-service
            # (no API at all). /internal/** matches no predicate, so
            # order-service's purchase-check stays service-to-service.

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      # WITHOUT this, Lettuce's default 60s command timeout means the
      # RedisRateLimiter filter (used by every route above) hangs on an
      # unresponsive-but-not-refusing Redis. Live-verified: pausing Redis made
      # EVERY route through this gateway take exactly 8s and 503 via orderCb's
      # own TimeLimiter (tripped by the hang, not by order-service, which
      # responds in <1s once its OWN identical Redis timeout is set - see
      # order-service/application.yml's twin fix and comment for the full story).
      timeout: 500ms

  security:
    oauth2:
      client:
        provider:
          keycloak:
            # DELIBERATELY NO issuer-uri HERE.
            # On the client side, issuer-uri triggers OIDC discovery AT STARTUP,
            # FROM INSIDE THE CONTAINER — where localhost:8090 does not resolve.
            # The gateway would crash-loop. Endpoints are configured manually,
            # split by caller (README §3):
            authorization-uri: http://localhost:8090/realms/easyshop/protocol/openid-connect/auth   # the BROWSER is redirected here
            token-uri: http://keycloak:8080/realms/easyshop/protocol/openid-connect/token   # the GATEWAY CONTAINER calls these
            jwk-set-uri: http://keycloak:8080/realms/easyshop/protocol/openid-connect/certs
            user-info-uri: http://keycloak:8080/realms/easyshop/protocol/openid-connect/userinfo
            # NOTE: there is deliberately NO end-session-uri property here - Boot
            # 4.1's OAuth2ClientProperties.Provider (spring-boot-security-oauth2-
            # client:4.1.0) has NO endSessionUri field at all (verified against
            # the actual class - javap has no getEndSessionUri/setEndSessionUri).
            # RP-initiated logout's end_session_endpoint is ONLY ever populated
            # via OIDC discovery (issuer-uri), which we can't use here for the
            # same crash-loop reason as authorization-uri above. See
            # KeycloakLogoutSuccessHandler for how the endpoint is supplied
            # instead (a plain constant, same URL as authorization-uri's host).
            # Pinned to sub so session principals and bearer principals name
            # themselves identically -> ONE rate-limit bucket per human
            # (see RateLimiterConfig.java). Changing this silently splits buckets.
            user-name-attribute: sub

        registration:
          keycloak:
            client-id: easyshop-gateway-bff
            client-secret: ${GATEWAY_BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            # Resolves to http://localhost:8080/login/oauth2/code/keycloak —
            # must match the redirect URI registered by
            # provision-gateway-bff-client.sh exactly.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # profile/email are NOT requested: this realm's import declared its
            # own "clientScopes" array, which replaces Keycloak's built-in set
            # rather than extending it — profile/email/basic were never created
            # (see add-sub-mapper.sh). Requesting them 400s with invalid_scope.
            # openid alone is enough: easyshop-api-audience is a DEFAULT scope
            # on this client (always included, no need to request it), and the
            # gateway/downstream services only ever read sub + roles.
            scope: openid

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/easyshop
          jwk-set-uri: http://localhost:8090/realms/easyshop/protocol/openid-connect/certs
          # ISSUER MISMATCH TRAP: iss is compared as an exact string. Tokens
          # minted via localhost:8090 carry iss=http://localhost:8090/...
          # If the gateway runs in Docker and uses http://keycloak:8080/...
          # here, validation fails despite everything else being correct.
          # Fix: set KC_HOSTNAME on Keycloak so iss is stable on both paths.
          audiences: [easyshop-api]

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# =============================================================================
# Actuator
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    gateway:
      # Exposure alone is insufficient - the gateway endpoint's default
      # access level is "none" because route introspection is more
      # sensitive than health/info. Needs this explicit grant.
      access: unrestricted
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true




# =============================================================================
# Resilience4j — reactive instances used by the filters above.
# The filter's `name:` arg maps to the instance names here.
# =============================================================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: TIME_BASED     # COUNT_BASED never fills on a
        # low-traffic dev gateway
        slidingWindowSize: 120            # seconds. Must exceed
          # minimumNumberOfCalls x worst-case call duration, or a sustained
          # hard-down dependency NEVER trips the breaker: with the old value
          # of 30s, 10 sequential calls each eaten by orderCb's 8s TimeLimiter
          # timeout take up to 80s to accumulate, so the earliest ones age out
          # of the window before the 10th arrives and bufferedCalls plateaus
          # below minimumNumberOfCalls forever (confirmed empirically via
          # verify-circuit-breakers.sh — the breaker never opened under a
          # continuous-timeout outage). 120s comfortably covers that with margin.
        minimumNumberOfCalls: 10          # DEV VALUE. Library default is 100 —
          # with that, the breaker NEVER opens
          # in dev and looks broken. Raise for
        # prod → add to the §7 reversal list.
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50         # a slow dependency is worse than a
        # dead one — failure rate alone misses it
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      catalogCb: { baseConfig: default }
      userCb:    { baseConfig: default }
      orderCb:   { baseConfig: default }
      cartCb:    { baseConfig: default }
      reviewCb:  { baseConfig: default }

  # ---------------------------------------------------------------------------
  # TimeLimiter — REQUIRED, and the #1 gateway trap.
  #
  # Spring Cloud CircuitBreaker applies a TimeLimiter with a DEFAULT TIMEOUT OF
  # 1 SECOND. If you configure nothing here, every downstream call slower than
  # 1s becomes a fallback — you will think the breaker is misfiring when it is
  # obeying a default you never set.
  #
  # Set from observed p95/p99, not round numbers.
  # ---------------------------------------------------------------------------
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true
    instances:
      catalogCb: { baseConfig: default }
      userCb:    { baseConfig: default }
      orderCb:   { baseConfig: default, timeoutDuration: 8s }  # checkout starts
      # a saga — slower
      cartCb:    { baseConfig: default }
      reviewCb:  { baseConfig: default }