server:
  port: 8084

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:3306/easyshop_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: easyshop
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_inventory

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# =============================================================================
# Retry — the canonical transient-DB-failure case: optimistic-lock contention
# on product_stock under a flash sale (see StockReservationTxn's javadoc).
# name must match @Retry(name = "stockReservation") on
# StockReservationService.reserve(), or this silently falls back to library
# defaults (maxAttempts=3, no backoff, no exception filtering).
# =============================================================================
resilience4j:
  retry:
    instances:
      stockReservation:
        maxAttempts: 5
        waitDuration: 50ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # De-synchronise threads that lost the same optimistic race together -
        # un-jittered backoff makes them all retry at the same instant and
        # collide again.
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        # ONLY the transient signal. Insufficient stock / product-not-found
        # are ordinary ReservationOutcome return values, never exceptions, so
        # they can never be retried regardless of this list - explicitly
        # scoping retryExceptions is still worth doing so an unrelated future
        # exception type doesn't silently start getting retried too.
        retryExceptions:
          - org.springframework.orm.ObjectOptimisticLockingFailureException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,retries,retryevents
  tracing:
    sampling:
      probability: 1.0