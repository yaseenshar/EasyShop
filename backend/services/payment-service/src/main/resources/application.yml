server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/easyshop_payment
    username: easyshop
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_payment

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      # Lettuce is Spring Boot's default Redis client (over Jedis) - it's
      # async/non-blocking under the hood (Netty-based) and thread-safe to
      # share a single connection across threads, whereas Jedis traditionally
      # needed a connection pool per thread. Worth knowing this is WHY Boot
      # defaults to Lettuce if asked in an interview.
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/easyshop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Resilience4j circuit breaker + retry configuration for the payment gateway
# call (PaymentGatewayClient, Step 4.2). These thresholds are deliberately
# explained, not just pasted - able to defend each number in an interview:
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        # Open the circuit once 50% of the last 10 calls failed - aggressive
        # enough to protect a struggling gateway, lenient enough not to trip
        # on normal noise (a handful of declined cards isn't "failure" here
        # since declines return a normal GatewayResult, not an exception).
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        # Stay OPEN for 10s before allowing a trial request through (HALF_OPEN)
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 200ms
        # Exponential backoff: 200ms, 400ms, 800ms - avoids hammering an
        # already-struggling gateway with immediate back-to-back retries.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.easyshop.payment.gateway.PaymentGatewayException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false