server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/easyshop_payment
    username: easyshop
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_payment

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      # Lettuce is Spring Boot's default Redis client (over Jedis) - it's
      # async/non-blocking under the hood (Netty-based) and thread-safe to
      # share a single connection across threads, whereas Jedis traditionally
      # needed a connection pool per thread. Worth knowing this is WHY Boot
      # defaults to Lettuce if asked in an interview.
      #
      # timeout, explicitly: without it Lettuce's default 60s command timeout
      # means an unresponsive (not just down) Redis hangs PaymentSagaListener/
      # RefundSagaListener's store.begin() call for up to 60s per delivery -
      # onRedisFailure=OPEN's catch(DataAccessException) never fires in time
      # to matter, and a slow-not-dead Redis stalls the Kafka consumer thread
      # instead of degrading. See order-service's application.yml for the
      # same fix and the live-verified failure mode this closes.
      timeout: 500ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/easyshop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

  # =============================================================================
  # Shared resilience config — paste into EVERY service that has a breaker
  # (payment-service, review-service, catalog-service).
  #
  # Same YAML-anchor consolidation applies as the OIDC block (§6.5) if you want
  # it in one place; kept per-service here so each file remains readable and
  # the instance overrides sit next to their base.
  # =============================================================================

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 10        # library default is 100 → breaker never
          # opens in dev. Prod value belongs on the
        # §7 dev-only reversal list.
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

        # ---------------------------------------------------------------------
        # 4xx IS NOT A DOWNSTREAM FAILURE.
        # A 404 from order-service means "no such order", not "order-service is
        # sick". Counting client errors lets one bad request pattern open the
        # breaker for every user. ignoreExceptions takes precedence over
        # recordExceptions, so listing here is unambiguous.
        #
        # Adjust the exception types to whatever your HTTP client actually
        # throws — RestClient throws HttpClientErrorException; a @HttpExchange
        # interface may surface something else. VERIFY by forcing a 404 and
        # reading the stack trace (§6.3), then confirm the breaker's
        # failure count did NOT move.
        # ---------------------------------------------------------------------
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException  # timeouts, conn refused
          - java.io.IOException
          - java.util.concurrent.TimeoutException

    instances:
      # ---- review-service -----------------------------------------------------
      # Existing breaker on PurchaseVerifier (§4.12 / §6.1 self-invocation fix).
      # Name must match the @CircuitBreaker(name = "...") already in the code.
      orderInternal:
        baseConfig: default
        slowCallDurationThreshold: 1s   # a badge lookup must never hold a page

      # ---- payment-service ----------------------------------------------------
      # Existing breaker on the external charge path.
      paymentGateway:
        baseConfig: default
        waitDurationInOpenState: 30s    # payment provider outages last longer;
        # hammering an unhealthy PSP is worse
        slowCallDurationThreshold: 5s   # PSPs are legitimately slow

      # ---- catalog-service (optional, see README) -----------------------------
      # Redis here is a CACHE (§4.9) — falling back to MySQL is real degradation.
      catalogCache:
        baseConfig: default
        waitDurationInOpenState: 5s

  # ---------------------------------------------------------------------------
  # Retry — only where the operation is idempotent.
  # Default aspect order puts Retry OUTSIDE CircuitBreaker, so each attempt
  # records its own breaker failure (N retries consume N window slots).
  #
  # @Retry(name = "paymentGateway") on PaymentGatewayClient.charge() IS safe
  # today because the gateway call is fully SIMULATED (no real PSP, no side
  # effect to duplicate) - see that class's javadoc. The moment it's swapped
  # for a real PSP integration, this retry must not survive unmodified: a real
  # charge is not naturally idempotent, and only an idempotency key (per-charge,
  # sent to the PSP so a retried request can't double-charge) makes retrying
  # that call safe. Re-verify this the day PaymentGatewayClient stops being a
  # stand-in.
  # ---------------------------------------------------------------------------
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      paymentGateway: { baseConfig: default }

# =============================================================================
# Actuator — add to every service with a breaker.
# =============================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false