server:
  port: 8086

spring:
  application:
    name: review-service

  datasource:
    # Per-service isolated database - review gets its own MySQL database.
    url: jdbc:mysql://localhost:3306/easyshop_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: easyshop
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_review

  # HTTP service group config for the OrderPurchaseClient (verified-current
  # Boot 4 pattern: per-group properties under spring.http.client.service).
  http:
    client:
      # Fleet-wide default for blocking HTTP clients
      connect-timeout: 2s
      read-timeout: 3s

      service:
        group:
          # Group name must match your @ImportHttpServices registration.
          order-client:
            # base-url: lb://order-service     # §9: lb:// syntax here is
            #                                  # flagged-unverified; the direct
            #                                  # host URL is the fallback
            connect-timeout: 1s
            read-timeout: 2s     # a Verified-Purchase badge must never hold a
            # page render. Set from observed p95/p99.
          order-service:
            # lb:// relies on Spring Cloud 2025.1's confirmed load-balancing
            # support for HTTP service groups resolving through Eureka.
            # FLAGGED: capability confirmed via spring.io blog, exact
            # property syntax unverified - if lb:// isn't honored here,
            # fall back to the direct form below and check the Spring
            # Cloud 2025.1 docs for the load-balanced variant.
            # base-url: http://localhost:8082
            base-url: lb://order-service
            read-timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/easyshop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

  # =============================================================================
  # Shared resilience config — paste into EVERY service that has a breaker
  # (payment-service, review-service, catalog-service).
  #
  # Same YAML-anchor consolidation applies as the OIDC block (§6.5) if you want
  # it in one place; kept per-service here so each file remains readable and
  # the instance overrides sit next to their base.
  # =============================================================================

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 10        # library default is 100 → breaker never
          # opens in dev. Prod value belongs on the
        # §7 dev-only reversal list.
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

        # ---------------------------------------------------------------------
        # 4xx IS NOT A DOWNSTREAM FAILURE.
        # A 404 from order-service means "no such order", not "order-service is
        # sick". Counting client errors lets one bad request pattern open the
        # breaker for every user. ignoreExceptions takes precedence over
        # recordExceptions, so listing here is unambiguous.
        #
        # Adjust the exception types to whatever your HTTP client actually
        # throws — RestClient throws HttpClientErrorException; a @HttpExchange
        # interface may surface something else. VERIFY by forcing a 404 and
        # reading the stack trace (§6.3), then confirm the breaker's
        # failure count did NOT move.
        # ---------------------------------------------------------------------
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException  # timeouts, conn refused
          - java.io.IOException
          - java.util.concurrent.TimeoutException

    instances:
      # ---- review-service -----------------------------------------------------
      # Existing breaker on PurchaseVerifier (§4.12 / §6.1 self-invocation fix).
      # Name must match the @CircuitBreaker(name = "...") already in the code.
      orderInternal:
        baseConfig: default
        slowCallDurationThreshold: 1s   # a badge lookup must never hold a page

      # ---- payment-service ----------------------------------------------------
      # Existing breaker on the external charge path.
      paymentGateway:
        baseConfig: default
        waitDurationInOpenState: 30s    # payment provider outages last longer;
        # hammering an unhealthy PSP is worse
        slowCallDurationThreshold: 5s   # PSPs are legitimately slow

      # ---- catalog-service (optional, see README) -----------------------------
      # Redis here is a CACHE (§4.9) — falling back to MySQL is real degradation.
      catalogCache:
        baseConfig: default
        waitDurationInOpenState: 5s

  # ---------------------------------------------------------------------------
  # DELIBERATELY NO retry config for "orderInternal" - PurchaseVerifier has no
  # @Retry (see its javadoc): a transient blip on a best-effort verified-
  # purchase badge isn't worth retrying, and retry would hit the MDC-cleared-
  # before-retry quirk on the thread-pool path. Retry belongs on inventory-
  # service's optimistic-lock path (resilience4j.retry.instances.stockReservation
  # there), not here.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Thread-pool bulkhead — isolates review-service's Tomcat threads from a slow
  # order-service (see PurchaseVerifier's javadoc for the full "why").
  # pool(4) + queue(8): sized so a concurrency burst well past that (the verify
  # script's default CONCURRENCY=20) reliably forces BulkheadFullException
  # instead of just queueing everything, which is the point of the isolation
  # test - excess load must be REJECTED fast, not absorbed unboundedly.
  # ---------------------------------------------------------------------------
  thread-pool-bulkhead:
    configs:
      default:
        maxThreadPoolSize: 4
        coreThreadPoolSize: 4
        queueCapacity: 8
        keepAliveDuration: 20ms
    instances:
      orderInternal: { baseConfig: default }

  # ---------------------------------------------------------------------------
  # TimeLimiter for the same "orderInternal" call - without this, @TimeLimiter
  # falls back to resilience4j's 1s library default, which is accidental, not
  # deliberate. A verified-purchase badge must never hold a page render.
  # ---------------------------------------------------------------------------
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      orderInternal: { baseConfig: default }

# =============================================================================
# Actuator — add to every service with a breaker.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # NOTE: "bulkheads"/"bulkheadevents" are the ONLY bulkhead endpoint IDs
        # resilience4j-spring-boot3 registers (verified against 2.2.0) - they
        # cover BOTH semaphore and thread-pool bulkheads (BulkheadEndpoint merges
        # both registries; BulkheadEventsEndpoint's getAllBulkheadEvents() flat-maps
        # every event consumer, thread-pool included). There is no separate
        # "threadpoolbulkheads"/"threadpoolbulkheadevents" endpoint ID to include.
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

# HEALTH INDICATOR WARNING:
# An OPEN breaker contributing DOWN to /actuator/health means Eureka may
# deregister a perfectly healthy service because its DEPENDENCY is sick —
# removing capacity during a partial outage. Verify the aggregate status while
# a breaker is open (verify-circuit-breakers.sh step 6 does this). If it
# reports DOWN, add `allowHealthIndicatorToFail: false` to the config block.

