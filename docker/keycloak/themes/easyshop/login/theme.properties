# EasyShop login/register theme.
#
# Deliberately CSS-only: we extend keycloak.v2 (parent=) rather than
# overriding any .ftl template. The v2 theme's actual login/register FORM
# LOGIC - CSRF tokens, WebAuthn, OTP, password reset, i18n, error handling -
# stays completely untouched; only resources/css/easyshop.css changes what
# it looks like. Rewriting the .ftl files ourselves would mean re-verifying
# all of that logic and re-doing it on every Keycloak upgrade - not worth it
# for a branding change.
parent=keycloak.v2
import=common/keycloak

styles=css/easyshop.css
