# =============================================================================
# EasyShop - MEMORY-OPTIMIZED docker-compose
# Target: full stack under ~5.5 GB worst-case on an 8 GB machine.
#
# The three layers applied here:
#   1. Every JVM capped (mem_limit) AND told about the cap (MaxRAMPercentage)
#   2. Zookeeper eliminated (Kafka KRaft), UI/observability behind profiles
#   3. Profiles enable running slices instead of the whole fleet
#
# MERGE NOTES vs your current file:
#   - Ports below match your running containers (cart 8087, notification 8088,
#     review 8086). Adjust build contexts to your layout if they differ.
#   - KRaft needs a FRESH Kafka volume: `docker compose down -v` once (or at
#     least remove the old kafka + zookeeper volumes) before first start -
#     Zookeeper-era data directories are not KRaft-compatible.
#   - Keep your .env exactly as is.
# =============================================================================

# Pinned explicitly: Compose otherwise derives the project name from this
# file's OWN directory ("infra" since the project-structure refactor moved
# this file off the repo root), which would rename every container
# (easyshop-postgres-1 -> infra-postgres-1, etc.) and break every script and
# doc in the repo that references the old easyshop-* names.
name: easyshop

# ── Shared JVM flags for every Spring Boot service ───────────────────────────
# JAVA_TOOL_OPTIONS is honored automatically by any JVM (you'll see
# "Picked up JAVA_TOOL_OPTIONS" in each service's log - that's your proof
# it applied). One anchor, no Dockerfile edits.
#
#   -XX:MaxRAMPercentage=70    heap = 70% of the CONTAINER limit (not host RAM)
#   -XX:+UseSerialGC           lowest-footprint GC; G1's bookkeeping is pure
#                              overhead on heaps this small (dev-only choice)
#   -Xss512k                   halve the default 1 MB thread stacks
#   -XX:MaxMetaspaceSize=160m  Spring apps settle ~100-130 MB; cap the rest
#   -XX:ReservedCodeCacheSize=48m   plenty once C2 is off (next flag)
#   -XX:TieredStopAtLevel=1    C1-only JIT: faster startup, smaller code
#                              cache; slower peak throughput - fine for dev,
#                              REMOVE for load testing / production
#   -XX:+ExitOnOutOfMemoryError    die fast and restart clean instead of
#                              limping along after an OOM

x-jvm-opts: &jvm_opts >-
  -XX:MaxRAMPercentage=70
  -XX:+UseSerialGC
  -Xss512k
  -XX:MaxMetaspaceSize=160m
  -XX:ReservedCodeCacheSize=48m
  -XX:TieredStopAtLevel=1
  -XX:+ExitOnOutOfMemoryError

x-oidc: &oidc
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8090/realms/easyshop
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/easyshop/protocol/openid-connect/certs
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: easyshop-api

# Spring-level trims, merged into each service's environment:
#   Tomcat 200 -> 20 max threads (stacks + churn), Hikari 10 -> 5 connections.
#   Harmlessly ignored by services without Tomcat (gateway/Netty) or without
#   a datasource (cart, notification).
x-spring-env: &spring_env
  JAVA_TOOL_OPTIONS: *jvm_opts
  SERVER_TOMCAT_THREADS_MAX: "20"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

# App healthchecks note: temurin/alpine JRE images ship no curl (ubuntu
# base) or no bash (alpine base), so portable in-compose probes for the
# Java apps are unreliable. Infra images (postgres/mysql/redis/kafka) ship
# their own CLI tools - those keep real healthchecks below, and they are
# the only hard startup dependencies (Flyway/Hikari fail fast without a
# DB; Kafka consumers need a broker). App-to-app ordering rides on client
# retry instead.

networks:
  easyshop-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  kafka-data:
  grafana-data:
  prometheus-data:

services:

  # ═══════════════════════ INFRASTRUCTURE (always on) ═══════════════════════

  service-discovery:
    build:
      context: ../backend
      dockerfile: infrastructure/service-discovery/Dockerfile
    ports: ["8761:8761"]
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: *jvm_opts
    networks: [easyshop-network]
    # NO healthcheck - deliberately. The previous bash-/dev/tcp probe was a
    # bash-ism that fails with exit 127 on any image without bash (alpine/
    # slim JRE bases), branding a working Eureka unhealthy. More importantly,
    # dependents now use service_started for discovery: Eureka CLIENTS RETRY
    # registration on their own, so startup ordering is not load-bearing
    # here - retry logic, not container choreography, handles it. If you
    # want a real probe back, reuse your previously-working healthcheck
    # (your images showed healthy before), or add curl/wget to the
    # Dockerfile and probe /actuator/health.

  api-gateway:
    build:
      context: ../backend
      dockerfile: infrastructure/api-gateway/Dockerfile
    ports: ["8080:8080"]
    mem_limit: 384m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      GATEWAY_BFF_CLIENT_SECRET: ${GATEWAY_BFF_CLIENT_SECRET}
      # Encrypts the access/refresh token VALUES the gateway now stores in
      # Redis. The gateway refuses to start without it rather than fall back to
      # writing them in the clear. Generate once and keep in .env alongside the
      # BFF secret:  openssl rand -base64 32
      GATEWAY_TOKEN_ENCRYPTION_KEY: ${GATEWAY_TOKEN_ENCRYPTION_KEY}
    depends_on:
      service-discovery: { condition: service_started }
      # Now a HARD dependency, not just for rate limiting: BFF sessions and
      # relayed tokens live in Redis, so a gateway that starts without it cannot
      # log anybody in.
      redis: { condition: service_healthy }
    networks: [easyshop-network]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    mem_limit: 256m
    environment:
      POSTGRES_USER: easyshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: easyshop
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.3
    # performance-schema=OFF alone saves ~150-200 MB of instrumentation
    # memory you will never look at in dev. Buffer pool pinned small and
    # explicit rather than left to grow.
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --table-definition-cache=400
    ports: ["3306:3306"]
    mem_limit: 448m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: easyshop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: easyshop
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    # maxmemory trimmed 512m -> 128m: dev cart/cache/idempotency data is
    # tiny. appendonly added because cart-service uses Redis as PRIMARY
    # store (Phase 8) - AOF bounds crash loss to ~1s vs RDB's ~60s.
    #
    # EVICTION POLICY: noeviction, NOT allkeys-lru. This one instance is shared
    # by six services with no logical-db separation - api-gateway (rate limits,
    # BFF sessions under easyshop:gateway:session:*, and encrypted relayed
    # tokens under gateway:oauth2:client:*), order, payment (idem:*), catalog
    # (cache), cart (cart:*), notification -
    # and maxmemory-policy is per INSTANCE, so a single policy has to be correct
    # for the most valuable data in it, not the average.
    #
    # allkeys-lru evicts ANY key under memory pressure, including keys that have
    # not expired. For cart that is silent data loss with no recovery path:
    # Redis is the cart's primary store, so an evicted cart is simply gone -
    # there is no database behind it to re-read. Catalog's cache filling this
    # instance up was enough to delete real shoppers' carts.
    #
    # noeviction instead rejects WRITES with an OOM error once memory is full.
    # That is the right trade for a store holding primary data: fail loudly and
    # recoverably rather than lose committed state silently. It is safe here
    # because every consumer already degrades gracefully on a Redis write
    # failure - catalog's CacheErrorHandler logs and falls back to MySQL, and
    # payment's idempotency begin() fails OPEN onto the orders table's UNIQUE
    # constraint. The one thing none of them can recover from is data that
    # vanished without an error, which is precisely what allkeys-lru produced.
    #
    # PRODUCTION ESCALATION: split this into two instances - a cache instance
    # (allkeys-lru, disposable, no AOF) and a data instance (noeviction, AOF,
    # holding cart:* and idem:*). Then each policy matches its data instead of
    # one policy having to cover both. Single instance is kept here because dev
    # compose values memory footprint over isolation.
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    mem_limit: 160m
    # REDIS_PASSWORD must exist as a CONTAINER env var for the healthcheck:
    # the $$ escape below defers expansion to the container's shell at probe
    # time, and without this line the container env had nothing to expand -
    # redis-cli authed with an empty password, never got PONG, and a
    # perfectly healthy Redis was branded unhealthy forever. (The single-$
    # form in command: is expanded by Compose from .env at parse time -
    # two different expansion moments, the root cause of the original bug.)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka in KRaft mode: ZOOKEEPER IS GONE (one whole JVM saved) ──────────
  # The broker is its own controller (KAFKA_PROCESS_ROLES). CLUSTER_ID is any
  # base64 UUID; cp-kafka formats an EMPTY data dir automatically on first
  # boot when it's set. Config below is the standard cp-kafka 7.x KRaft
  # single-node recipe - verify against Confluent's docs if startup complains.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports: ["9092:9092"]
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Confluent images default to a 1 GB heap - this line alone is a
      # ~750 MB saving. 256m is comfortable for a dev broker.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [easyshop-network]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    ports:
      - "8090:8080"    # admin console + OIDC endpoints
      - "9000:9000"    # management interface: /health, /metrics (KC 25+)
    mem_limit: 640m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: easyshop
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public issuer — matches the URL browsers and host-side scripts use
      # (host port 8090 -> container 8080).
      KC_HOSTNAME: "http://localhost:8090"
      # Intent: allow backchannel (container-to-container) requests on
      # http://keycloak:8080 to keep working while the issuer stays pinned
      # to the public URL above.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
      KEYCLOAK_REVIEW_SERVICE_CLIENT_SECRET: ${KEYCLOAK_REVIEW_SERVICE_CLIENT_SECRET}
      # RENAMED in KC 26 (old KEYCLOAK_ADMIN vars are deprecated/removed):
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Health + metrics on management port 9000:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # JVM caps from the memory-optimization phase, unchanged:
      JAVA_OPTS_APPEND: "-Xms128m -Xmx384m"
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import
      # CSS-only override of keycloak.v2 (docker/keycloak/themes/easyshop/) -
      # see that theme's theme.properties for why it's CSS-only, not FTL.
      - ./docker/keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ easyshop-network ]
    healthcheck:
      # The KC image (UBI base) ships no curl/wget but DOES ship bash, so
      # the /dev/tcp trick that failed on our slim app images works here -
      # upgraded to a real HTTP GET against /health/ready on the mgmt port
      # and grepping the response for UP. Community-standard recipe;
      # verify once with `docker inspect --format='{{json .State.Health}}'`.
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          cat <&3 | grep -q '"status": *"UP"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ═══════════════════════ DOMAIN SERVICES ══════════════════════════════════
  # Limits are sized by dependency weight: Kafka+JPA services get 384m,
  # JPA-or-cache services 352m, Redis-only services 288m.

  user-service:
    build:
      context: ../backend
      dockerfile: services/user-service/Dockerfile
    ports: ["8081:8081"]
    mem_limit: 320m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easyshop_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # This service declares no Redis dependency of its own, but common-lib
      # brings spring-boot-starter-data-redis onto every classpath, so Boot
      # auto-configures a connection regardless. Without these it dials
      # localhost:6379 inside the container, gets connection-refused, and
      # /actuator/health reports DOWN - which reads like a broken service
      # rather than a missing environment variable.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: {condition: service_started}
    networks: [easyshop-network]

  order-service:
    build:
      context: ../backend
      dockerfile: services/order-service/Dockerfile
    ports: ["8082:8082"]
    mem_limit: 384m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easyshop_order
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: {condition: service_started}
    networks: [easyshop-network]

  payment-service:
    build:
      context: ../backend
      dockerfile: services/payment-service/Dockerfile
    ports: ["8083:8083"]
    mem_limit: 384m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easyshop_payment
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: {condition: service_started}
    networks: [easyshop-network]

  inventory-service:
    build:
      context: ../backend
      dockerfile: services/inventory-service/Dockerfile
    ports: ["8084:8084"]
    mem_limit: 384m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easyshop_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: easyshop
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # See the note on user-service: common-lib puts Redis on every classpath.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: { condition: service_started }
    networks: [easyshop-network]

  catalog-service:
    build:
      context: ../backend
      dockerfile: services/catalog-service/Dockerfile
    ports: ["8085:8085"]
    mem_limit: 352m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easyshop_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: easyshop
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: { condition: service_started }
    networks: [easyshop-network]

  review-service:
    build:
      context: ../backend
      dockerfile: services/review-service/Dockerfile
    ports: ["8086:8086"]
    mem_limit: 352m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easyshop_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: easyshop
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # See the note on user-service: common-lib puts Redis on every classpath.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: { condition: service_started }
    networks: [easyshop-network]

  cart-service:
    build:
      context: ../backend
      dockerfile: services/cart-service/Dockerfile
    ports: ["8087:8087"]
    mem_limit: 288m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: {condition: service_started}
    networks: [easyshop-network]

  notification-service:
    build:
      context: ../backend
      dockerfile: services/notification-service/Dockerfile
    ports: ["8088:8088"]
    mem_limit: 288m
    environment:
      <<: [*spring_env, *oidc]
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-discovery: { condition: service_started }
      api-gateway: {condition: service_started}
    networks: [easyshop-network]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["4200:80"]
    mem_limit: 64m
    depends_on:
      api-gateway: { condition: service_started }
    networks: [easyshop-network]
    healthcheck:
      # nginx:alpine ships busybox wget (unlike the JVM app images - see the
      # "App healthchecks note" above), so a real probe is reliable here.
      # "localhost" resolves to ::1 first in this image and nginx only
      # listens on IPv4 (see nginx.conf) - use 127.0.0.1 to avoid a
      # permanently-refused IPv6 healthcheck against an otherwise-healthy server.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════ ON-DEMAND TOOLS (profiles) ═══════════════════════════
  # Not started by default. Start with:
  #   docker compose --profile tools up -d          (Kafka UI)
  #   docker compose --profile observability up -d  (Prometheus + Grafana)

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports: ["9090:8080"]
    mem_limit: 384m
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
    depends_on: [kafka]
    networks: [easyshop-network]

  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: ["observability"]
    ports: ["9091:9090"]
    mem_limit: 256m
    # NOTE the port asymmetry: 9091 on the host, 9090 in the container. Grafana
    # reaches it as http://prometheus:9090 over easyshop-network; a browser uses
    # localhost:9091. Wiring the datasource to 9091 is the usual mistake.
    #
    # THE COMMAND REPLACES the image's default CMD rather than adding to it, so
    # all four original flags are repeated here. Dropping --config.file or
    # --storage.tsdb.path would leave Prometheus running happily against its
    # built-in defaults, scraping nothing - a failure that looks like a healthy
    # container.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      # Bounded on BOTH axes deliberately. Time alone does not bound disk: 15
      # days of a fleet this size is small today, but every new service and
      # every new label multiplies it, and the first sign of trouble would be
      # this dev box running out of space. Whichever limit is reached first
      # wins, so the size cap is the backstop for a cardinality mistake.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # WITHOUT THIS, /prometheus is container-local and every restart or
      # `docker compose down` silently destroys all metric history - which is
      # exactly what happened to the data collected while verifying the
      # instrumentation ticket. Every other stateful service here already had a
      # named volume; Prometheus was the one exception, and the symptom is not
      # an error but graphs that simply start at "now" after each restart.
      - prometheus-data:/prometheus
    networks: [easyshop-network]

  grafana:
    image: grafana/grafana:10.4.3
    profiles: ["observability"]
    ports: ["3000:3000"]
    mem_limit: 192m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks: [easyshop-network]
